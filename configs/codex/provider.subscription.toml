# Merge this provider into %USERPROFILE%\.codex\config.toml.
# Keep your existing `model` and `model_reasoning_effort` until subscription
# passthrough has been verified with a single model.
model_provider = "litellm_subscription"

[model_providers.litellm_subscription]
name = "LiteLLM subscription"
base_url = "http://localhost:4000/v1"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = true
env_http_headers = { "x-litellm-api-key" = "LITELLM_API_KEY" }
