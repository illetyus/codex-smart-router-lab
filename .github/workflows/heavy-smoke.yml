name: Heavy Docker smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-health:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heavy-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Create disposable CI environment
        shell: bash
        run: |
          cat > .env <<'ENV'
          LITELLM_MASTER_KEY=sk-ci-only-not-a-real-secret
          LITELLM_SALT_KEY=sk-ci-salt-only-not-a-real-secret
          POSTGRES_PASSWORD=ci-only-password
          ENV
      - name: Render compose
        run: docker compose config --quiet
      - name: Build pinned LiteLLM source
        run: docker compose build litellm
      - name: Start subscription baseline
        env:
          CODEX_ROUTER_CONFIG: subscription.yaml
        run: docker compose up -d --wait
      - name: Verify baseline health
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4000/health/liveliness
      - name: Prove restricted K2 virtual key
        run: python tools/k2_key_smoke.py --master-key sk-ci-only-not-a-real-secret
      - name: Restart with router-free model probe config
        shell: bash
        run: |
          CODEX_ROUTER_CONFIG=model-probe.yaml docker compose up -d --force-recreate litellm
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health/liveliness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs litellm
          exit 1
      - name: Restart with Auto Router config
        shell: bash
        run: |
          CODEX_ROUTER_CONFIG=autorouter.yaml docker compose up -d --force-recreate litellm
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health/liveliness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs litellm
          exit 1
      - name: Dry-run committed Auto Router through the real proxy
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python tools/router_dry_run.py --master-key sk-ci-only-not-a-real-secret
      - name: Show final status
        if: always()
        run: docker compose ps && docker compose logs --tail=100 litellm
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
