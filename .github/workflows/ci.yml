name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: '3.13'
      - run: pip install --disable-pip-version-check pytest pyyaml
      - run: pytest -q
      - run: python tools/validate_repo.py
      - name: Render compose with disposable CI values
        shell: bash
        run: |
          LITELLM_MASTER_KEY=sk-ci-render-only \
          LITELLM_SALT_KEY=sk-ci-render-salt-only \
          POSTGRES_PASSWORD=ci-render-only \
          docker compose config --quiet

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${($_.Extent.File)}:${($_.Extent.StartLineNumber)} $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Verify Codex rollout inspector behavior
        shell: pwsh
        run: |
          $sessions = Join-Path $env:RUNNER_TEMP 'codex-sessions'
          New-Item -ItemType Directory -Force -Path $sessions | Out-Null

          $real = Join-Path $sessions 'rollout-real.jsonl'
          @'
          {"timestamp":"2026-11-01T00:00:00Z","type":"session_meta","payload":{"parent_thread_id":"parent-1","agent_role":"worker","source":"vscode"}}
          {"timestamp":"2026-11-01T00:00:01Z","type":"turn_context","payload":{"model":"gpt-6-luna","effort":"high"}}
          '@ | Set-Content -Path $real -Encoding utf8
          (Get-Item $real).LastWriteTime = [datetime]'2026-11-01T00:00:00Z'

          $review = Join-Path $sessions 'rollout-review.jsonl'
          @'
          {"timestamp":"2026-11-01T00:01:00Z","type":"session_meta","payload":{"source":"vscode"}}
          {"timestamp":"2026-11-01T00:01:01Z","type":"turn_context","payload":{"model":"codex-auto-review","effort":"medium"}}
          '@ | Set-Content -Path $review -Encoding utf8
          (Get-Item $review).LastWriteTime = [datetime]'2026-11-01T00:01:00Z'

          $result = & ./scripts/windows/inspect-session.ps1 -SessionsRoot $sessions | ConvertFrom-Json
          if ($result.Model -ne 'gpt-6-luna') { throw "Expected gpt-6-luna, got $($result.Model)" }
          if ($result.Effort -ne 'high') { throw "Expected high, got $($result.Effort)" }
          if ($result.Parent -ne 'parent-1') { throw "Expected parent-1, got $($result.Parent)" }
          if ($result.AgentRole -ne 'worker') { throw "Expected worker, got $($result.AgentRole)" }
      - name: Verify Codex virtual-key provisioner behavior
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'key-provisioner'
          $repoRoot = Join-Path $testRoot 'repo'
          $codexHome = Join-Path $testRoot 'codex'
          New-Item -ItemType Directory -Force -Path $repoRoot, $codexHome | Out-Null
          'LITELLM_MASTER_KEY=sk-test-master' | Set-Content -Path (Join-Path $repoRoot '.env') -Encoding utf8
          'EXISTING_VAR=keep' | Set-Content -Path (Join-Path $codexHome '.env') -Encoding utf8

          $serverPath = Join-Path $testRoot 'mock_litellm.py'
          @'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          MASTER = "Bearer sk-test-master"
          VIRTUAL = "sk-test-virtual"
          K2_MODELS = ["gpt-6.1-sol", "codex-*"]
          K3_MODELS = ["gpt-6.1-sol", "gpt-6-luna", "gpt-6.1-terra", "gpt-6-sol", "gpt-6-astra", "codex-*"]
          current_models = K2_MODELS

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *_):
                  pass

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  global current_models
                  if self.path != "/key/generate":
                      return self.send_json(404, {"error": "not found"})
                  if self.headers.get("Authorization") != MASTER:
                      return self.send_json(401, {"error": "bad master key"})
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  requested = payload.get("models", [])
                  allowed = {tuple(sorted(K2_MODELS)), tuple(sorted(K3_MODELS))}
                  if tuple(sorted(requested)) not in allowed:
                      return self.send_json(400, {"error": "unexpected models"})
                  current_models = requested
                  self.send_json(200, {"key": VIRTUAL})

              def do_GET(self):
                  if self.path != "/key/info":
                      return self.send_json(404, {"error": "not found"})
                  if self.headers.get("Authorization") != f"Bearer {VIRTUAL}":
                      return self.send_json(401, {"error": "bad virtual key"})
                  self.send_json(200, {"info": {"models": current_models}})

          HTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          '@ | Set-Content -Path $serverPath -Encoding utf8

          $server = Start-Process python -ArgumentList $serverPath -PassThru
          try {
            Start-Sleep -Seconds 2
            $result = & ./scripts/windows/provision-codex-key.ps1 -Profile k2 -BaseUrl 'http://127.0.0.1:18080' -RepoRoot $repoRoot -CodexHome $codexHome | ConvertFrom-Json

            if ($result.Profile -ne 'k2') { throw "Expected k2 profile, got $($result.Profile)" }
            if (@($result.Models).Count -ne 2) { throw 'Expected exactly two K2 models' }

            $envLines = @(Get-Content -Path (Join-Path $codexHome '.env'))
            if ($envLines -notcontains 'EXISTING_VAR=keep') { throw 'Existing dotenv content was not preserved' }
            if ($envLines -notcontains 'LITELLM_API_KEY=sk-test-virtual') { throw 'Virtual key was not stored' }
            if (($envLines -join [char]10) -match 'sk-test-master') { throw 'Master key leaked into Codex dotenv' }

            $backupLines = @(Get-Content -Path (Join-Path $codexHome '.env.pre-litellm-backup'))
            if ($backupLines -notcontains 'EXISTING_VAR=keep') { throw 'Codex dotenv backup was not created correctly' }
            if (($backupLines -join [char]10) -match 'LITELLM_API_KEY') { throw 'Backup unexpectedly contains a LiteLLM virtual key' }

            $k3 = & ./scripts/windows/provision-codex-key.ps1 -Profile k3 -BaseUrl 'http://127.0.0.1:18080' -RepoRoot $repoRoot -CodexHome $codexHome | ConvertFrom-Json
            if ($k3.Profile -ne 'k3') { throw "Expected k3 profile, got $($k3.Profile)" }
            if (@($k3.Models).Count -ne 6) { throw 'Expected exactly six K3 models' }

            $k3EnvLines = @(Get-Content -Path (Join-Path $codexHome '.env'))
            if ($k3EnvLines -notcontains 'EXISTING_VAR=keep') { throw 'K3 provisioning lost existing dotenv content' }
            if (@($k3EnvLines | Where-Object { $_ -match '^LITELLM_API_KEY=' }).Count -ne 1) { throw 'K3 provisioning duplicated the virtual-key line' }
            if (($k3EnvLines -join [char]10) -match 'sk-test-master') { throw 'K3 provisioning leaked the master key' }

            $backupAfterK3 = @(Get-Content -Path (Join-Path $codexHome '.env.pre-litellm-backup'))
            if (($backupAfterK3 -join [char]10) -ne ($backupLines -join [char]10)) { throw 'K3 provisioning modified the original backup' }
          }
          finally {
            if ($null -ne $server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Verify Codex provider configure and restore behavior
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'codex-configurator'
          $codexHome = Join-Path $testRoot 'codex'
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null

          $configPath = Join-Path $codexHome 'config.toml'
          @'
          model = "gpt-6.1-sol"
          reasoning_effort = "medium"
          model_provider = "openai"

          [features]
          multi_agent = true
          '@ | Set-Content -Path $configPath -Encoding utf8NoBOM

          @'
          EXISTING_VAR=keep
          LITELLM_API_KEY=sk-test-virtual
          '@ | Set-Content -Path (Join-Path $codexHome '.env') -Encoding utf8NoBOM
          'EXISTING_VAR=keep' | Set-Content -Path (Join-Path $codexHome '.env.pre-litellm-backup') -Encoding utf8NoBOM

          $originalHash = (Get-FileHash -Algorithm SHA256 -Path $configPath).Hash

          & ./scripts/windows/configure-codex-provider.ps1 -CodexHome $codexHome | Out-Null
          & ./scripts/windows/configure-codex-provider.ps1 -CodexHome $codexHome | Out-Null

          $configured = Get-Content -Raw -Path $configPath
          if ([regex]::Matches($configured, '(?m)^model_provider\s*=').Count -ne 1) { throw 'Top-level model_provider was duplicated' }
          if ([regex]::Matches($configured, '(?m)^\[model_providers\.litellm_subscription\]\s*$').Count -ne 1) { throw 'LiteLLM provider table was duplicated' }
          if ($configured -notmatch 'model_provider = "litellm_subscription"') { throw 'LiteLLM provider was not activated' }
          if ($configured -notmatch 'model = "gpt-6\.1-sol"') { throw 'Existing model setting was lost' }
          if ($configured -notmatch 'reasoning_effort = "medium"') { throw 'Existing reasoning effort was lost' }
          if ($configured -notmatch '(?m)^\[features\]\s*$') { throw 'Existing TOML table was lost' }
          if ($configured -notmatch 'multi_agent = true') { throw 'Existing feature setting was lost' }

          $backupPath = Join-Path $codexHome 'config.toml.pre-litellm-backup'
          if (-not (Test-Path $backupPath)) { throw 'Config backup was not created' }
          $backupHash = (Get-FileHash -Algorithm SHA256 -Path $backupPath).Hash
          if ($backupHash -ne $originalHash) { throw 'Config backup does not match the original file' }

          & ./scripts/windows/restore-codex-provider.ps1 -CodexHome $codexHome | Out-Null

          $restoredHash = (Get-FileHash -Algorithm SHA256 -Path $configPath).Hash
          if ($restoredHash -ne $originalHash) { throw 'Config restore did not reproduce the original file' }

          $envLines = @(Get-Content -Path (Join-Path $codexHome '.env'))
          if ($envLines -notcontains 'EXISTING_VAR=keep') { throw 'Dotenv restore lost the original variable' }
          if (($envLines -join [char]10) -match 'LITELLM_API_KEY') { throw 'Dotenv restore retained the LiteLLM key' }

  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify pinned LiteLLM source contract
        shell: bash
        run: |
          set -euo pipefail
          REF=4bdeb1378bb19a453cd3c49d383ebe76f057d2c6
          BASE=https://raw.githubusercontent.com/BerriAI/litellm/$REF
          curl -fsSLo /tmp/pyproject.toml "$BASE/pyproject.toml"
          curl -fsSLo /tmp/presets.json "$BASE/litellm/proxy/public_endpoints/autorouter_presets.json"
          grep -F 'version = "1.109.0"' /tmp/pyproject.toml
          grep -F '"openai_family"' /tmp/presets.json
          grep -F '"gpt-6-luna"' /tmp/presets.json
          grep -F '"gpt-6-astra"' /tmp/presets.json

          CODEX_REF=67f0994b532b8740f14b5b738af7b7b2a915b1d6
          SUPERPOWERS_REF=2ce8aa15d05bd57213e6f746f953aafb7ded7a8b
          curl -fsSLo /tmp/codex-spawn.rs "https://raw.githubusercontent.com/openai/codex/$CODEX_REF/codex-rs/core/src/tools/handlers/multi_agents_v2/spawn.rs"
          curl -fsSLo /tmp/superpowers-sdd.md "https://raw.githubusercontent.com/obra/superpowers/$SUPERPOWERS_REF/skills/subagent-driven-development/SKILL.md"
          curl -fsSLo /tmp/superpowers-fix-loop.md "https://raw.githubusercontent.com/obra/superpowers/$SUPERPOWERS_REF/skills/subagent-driven-development/references/fix-loop.md"
          grep -F 'model: Option<String>' /tmp/codex-spawn.rs
          grep -F 'reasoning_effort: Option<ReasoningEffort>' /tmp/codex-spawn.rs
          grep -F 'Always specify the model explicitly when dispatching a subagent.' /tmp/superpowers-sdd.md
          grep -F 'Fix-loop escalation (rounds 4-5)' /tmp/superpowers-sdd.md
          grep -F 'Rounds 4-5 — dispatch a fresh implementer on a more capable model' /tmp/superpowers-fix-loop.md
