name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: '3.13'
      - run: pip install --disable-pip-version-check pytest pyyaml
      - run: pytest -q
      - run: python tools/validate_repo.py
      - name: Render compose with disposable CI values
        shell: bash
        run: |
          LITELLM_MASTER_KEY=sk-ci-render-only \
          LITELLM_SALT_KEY=sk-ci-render-salt-only \
          POSTGRES_PASSWORD=ci-render-only \
          docker compose config --quiet

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${($_.Extent.File)}:${($_.Extent.StartLineNumber)} $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Verify Codex rollout inspector behavior
        shell: pwsh
        run: |
          $sessions = Join-Path $env:RUNNER_TEMP 'codex-sessions'
          New-Item -ItemType Directory -Force -Path $sessions | Out-Null

          $real = Join-Path $sessions 'rollout-real.jsonl'
          @'
          {"timestamp":"2026-11-01T00:00:00Z","type":"session_meta","payload":{"parent_thread_id":"parent-1","agent_role":"worker","source":"vscode"}}
          {"timestamp":"2026-11-01T00:00:01Z","type":"turn_context","payload":{"model":"gpt-6-luna","effort":"high"}}
          '@ | Set-Content -Path $real -Encoding utf8
          (Get-Item $real).LastWriteTime = [datetime]'2026-11-01T00:00:00Z'

          $review = Join-Path $sessions 'rollout-review.jsonl'
          @'
          {"timestamp":"2026-11-01T00:01:00Z","type":"session_meta","payload":{"source":"vscode"}}
          {"timestamp":"2026-11-01T00:01:01Z","type":"turn_context","payload":{"model":"codex-auto-review","effort":"medium"}}
          '@ | Set-Content -Path $review -Encoding utf8
          (Get-Item $review).LastWriteTime = [datetime]'2026-11-01T00:01:00Z'

          $result = & ./scripts/windows/inspect-session.ps1 -SessionsRoot $sessions | ConvertFrom-Json
          if ($result.Model -ne 'gpt-6-luna') { throw "Expected gpt-6-luna, got $($result.Model)" }
          if ($result.Effort -ne 'high') { throw "Expected high, got $($result.Effort)" }
          if ($result.Parent -ne 'parent-1') { throw "Expected parent-1, got $($result.Parent)" }
          if ($result.AgentRole -ne 'worker') { throw "Expected worker, got $($result.AgentRole)" }

  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify pinned LiteLLM source contract
        shell: bash
        run: |
          set -euo pipefail
          REF=4bdeb1378bb19a453cd3c49d383ebe76f057d2c6
          BASE=https://raw.githubusercontent.com/BerriAI/litellm/$REF
          curl -fsSLo /tmp/pyproject.toml "$BASE/pyproject.toml"
          curl -fsSLo /tmp/presets.json "$BASE/litellm/proxy/public_endpoints/autorouter_presets.json"
          grep -F 'version = "1.109.0"' /tmp/pyproject.toml
          grep -F '"openai_family"' /tmp/presets.json
          grep -F '"gpt-6-luna"' /tmp/presets.json
          grep -F '"gpt-6-astra"' /tmp/presets.json

          CODEX_REF=67f0994b532b8740f14b5b738af7b7b2a915b1d6
          SUPERPOWERS_REF=2ce8aa15d05bd57213e6f746f953aafb7ded7a8b
          curl -fsSLo /tmp/codex-spawn.rs "https://raw.githubusercontent.com/openai/codex/$CODEX_REF/codex-rs/core/src/tools/handlers/multi_agents_v2/spawn.rs"
          curl -fsSLo /tmp/superpowers-sdd.md "https://raw.githubusercontent.com/obra/superpowers/$SUPERPOWERS_REF/skills/subagent-driven-development/SKILL.md"
          curl -fsSLo /tmp/superpowers-fix-loop.md "https://raw.githubusercontent.com/obra/superpowers/$SUPERPOWERS_REF/skills/subagent-driven-development/references/fix-loop.md"
          grep -F 'model: Option<String>' /tmp/codex-spawn.rs
          grep -F 'reasoning_effort: Option<ReasoningEffort>' /tmp/codex-spawn.rs
          grep -F 'Always specify the model explicitly when dispatching a subagent.' /tmp/superpowers-sdd.md
          grep -F 'Fix-loop escalation (rounds 4-5)' /tmp/superpowers-sdd.md
          grep -F 'Rounds 4-5 — dispatch a fresh implementer on a more capable model' /tmp/superpowers-fix-loop.md
